<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - SkillUp NGO</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    <div class="auth-box">
        <h2 style="color: #1e3a8a; margin-bottom: 10px;">Admin Portal</h2>
        <p style="margin-bottom: 20px; font-size: 14px; color: #64748b;">Secure access to website management</p>
        
        <form method="POST">
            <input type="text" name="username" placeholder="Admin Username" required>
            <input type="password" name="password" placeholder="Password" required>
            
            <button type="submit" class="btn-blue">Login to Manage Content</button>
        </form>
        
        <div style="margin-top: 20px;">
            <a href="/home" style="text-decoration: none; color: #64748b; font-size: 13px;">← Back to Home</a>
        </div>
    </div>
</body>
</html>
