<!DOCTYPE html>
<html>
<head>
    <title>Welcome - SkillUp NGO</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">

<div class="auth-box">
    <h1>Welcome</h1>
    <p>Please login or register to continue</p>
    
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <div class="auth-buttons">
            <button name="action" value="login" class="btn-blue">Login</button>
            <button name="action" value="register" class="btn-blue" style="background-color: #1e3a8a;">Register</button>
        </div>
    </form>

    <a href="#" class="forgot-link" style="display:block; margin-top:15px; color:#1e3a8a; text-decoration:none;">Forgot password?</a>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="flash-message">
              {{ msg }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
</div>

</body>
</html>
